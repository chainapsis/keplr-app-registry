name: Pull request to main branch action
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Suggested app validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"

      - run: npm install --global yarn
      - run: yarn install --immutable
      - run: yarn tsc --noEmit
      - run: yarn validate-sort-config
      - run: yarn make-app-list

      - name: Get changed files
        id: changed-files
        uses: step-security/changed-files@v47.0.5
        with:
          use_rest_api: true
          files: |
            apps/**/app.json
            sort-config.json

      - name: Validate app.json
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == *"app.json"* ]]; then
              yarn validate-app $file
            fi
          done

      - name: Validate icon.png
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ $file == *"icon.png"* ]]; then
              yarn validate-icon $file
            fi
          done

      - name: Validate sort-config.json
        if: contains(steps.changed-files.outputs.all_changed_files, 'sort-config.json')
        run: yarn validate-sort-config
